# Docker Compose stack for tierlistrr.
#
# Domain / secrets are NOT hardcoded here — set them in your platform's
# environment (or a .env file next to this compose). Minimum to set:
#   BETTER_AUTH_SECRET   (required, random string)
#   TIERLISTRR_HOST      (your public hostname, for the Traefik router rule)
#   BETTER_AUTH_URL      (your public URL, e.g. https://$TIERLISTRR_HOST)
#   WHITELIST_HOST_FILE  (absolute host path of the sign-in allowlist, optional)
# Optional: SMTP_* (email OTP), GROQ_API_KEY / POLLINATIONS_TOKEN (AI).
#
# The Traefik labels assume an external "traefik" network and TLS via the
# "websecure" entrypoint. Remove them and uncomment `ports` below if you don't
# use Traefik.
services:
  tierlistrr:
    container_name: tierlistrr
    # Use the prebuilt image from GitHub Container Registry (recommended):
    image: ghcr.io/nathan71370/tierlistrr:latest
    # ...or build locally instead: comment out `image` above, uncomment `build`,
    # and run `docker compose up -d --build`.
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GROQ_MODEL: "${GROQ_MODEL:-llama-3.3-70b-versatile}"
      GROQ_BASE_URL: "${GROQ_BASE_URL:-https://api.groq.com/openai/v1}"
      POLLINATIONS_TOKEN: "${POLLINATIONS_TOKEN:-}"
      # Auth (better-auth). BETTER_AUTH_SECRET is REQUIRED in prod (random string).
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:-}"
      # Public URL — must match the browser origin (CSRF). Auto-derived from
      # TIERLISTRR_HOST; override BETTER_AUTH_URL if your scheme/host differ.
      BETTER_AUTH_URL: "${BETTER_AUTH_URL:-https://${TIERLISTRR_HOST}}"
      # Optional extra trusted origins, comma-separated (e.g. apex + www).
      BETTER_AUTH_TRUSTED_ORIGINS: "${BETTER_AUTH_TRUSTED_ORIGINS:-}"
      # Optional sign-in allowlist. Only defined when WHITELIST_HOST_FILE is
      # set below — an undefined WHITELIST_PATH means "open to everyone".
      WHITELIST_PATH: "${WHITELIST_HOST_FILE:+/config/whitelist.txt}"
      # Email OTP delivery (e.g. Gmail: smtp.gmail.com + app password).
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
    volumes:
      - tierlistrr-data:/data
      # Sign-in allowlist, mounted read-only: one email (or @domain) per line,
      # `#` for comments. WHITELIST_HOST_FILE is an ABSOLUTE path on the host,
      # kept outside the repo (a redeploy may reclone it). The file must EXIST
      # before the first `up`: Docker creates a directory in place of a missing
      # file, and the app would then refuse every sign-in.
      #   install -Dm644 /dev/null /srv/tierlistrr/whitelist.txt
      #   echo 'you@example.com' >> /srv/tierlistrr/whitelist.txt
      # Leave it unset for an open instance: /dev/null is mounted instead and
      # never read, since WHITELIST_PATH stays undefined.
      - "${WHITELIST_HOST_FILE:-/dev/null}:/config/whitelist.txt:ro"
    # Not using Traefik? Comment out `networks`/`labels` and expose a port:
    # ports:
    #   - "${TIERLISTRR_PORT:-3000}:3000"
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tierlistrr.rule=Host(`${TIERLISTRR_HOST:-tierlistrr.example.com}`)"
      - "traefik.http.routers.tierlistrr.entrypoints=websecure"
      - "traefik.http.routers.tierlistrr.tls=true"
      - "traefik.http.services.tierlistrr.loadbalancer.server.port=3000"

volumes:
  tierlistrr-data:

networks:
  traefik:
    external: true
