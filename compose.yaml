# Docker Compose stack for tierlistrr.
#
# `limperiam` branch: sign-in is delegated to limperiam-auth (see README).
# Minimum to set: TIERLISTRR_HOST (public hostname, for the Traefik router).
# The AUTH_* defaults below fit *.limperiam.com. Optional: GROQ_API_KEY /
# POLLINATIONS_TOKEN (AI).
#
# The Traefik labels assume an external "traefik" network and TLS via the
# "websecure" entrypoint. Remove them and uncomment `ports` below if you don't
# use Traefik.
services:
  tierlistrr:
    container_name: tierlistrr
    # Use the prebuilt image from GitHub Container Registry (recommended):
    # The `limperiam` branch image — `:latest` is the generic build from main.
    image: ghcr.io/nathan71370/tierlistrr:limperiam
    # ...or build locally instead: comment out `image` above, uncomment `build`,
    # and run `docker compose up -d --build`.
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GROQ_MODEL: "${GROQ_MODEL:-llama-3.3-70b-versatile}"
      GROQ_BASE_URL: "${GROQ_BASE_URL:-https://api.groq.com/openai/v1}"
      POLLINATIONS_TOKEN: "${POLLINATIONS_TOKEN:-}"
      # Session checks against limperiam-auth, over the `traefik` Docker
      # network both stacks are attached to.
      AUTH_INTERNAL_URL: "${AUTH_INTERNAL_URL:-http://limperiam-auth:3000}"
      # Sign-in / sign-out target, browser side. Must be https (Secure cookie).
      AUTH_PUBLIC_URL: "${AUTH_PUBLIC_URL:-https://auth.limperiam.com}"
      # This app's slug in the limperiam-auth catalogue: writing is open to the
      # groups the admin opened THIS card to. Change only if the card has
      # another id in /admin.
      AUTH_APP_SLUG: "${AUTH_APP_SLUG:-tierlistrr}"
    volumes:
      - tierlistrr-data:/data
    # Not using Traefik? Comment out `networks`/`labels` and expose a port:
    # ports:
    #   - "${TIERLISTRR_PORT:-3000}:3000"
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tierlistrr.rule=Host(`${TIERLISTRR_HOST:-tierlistrr.example.com}`)"
      - "traefik.http.routers.tierlistrr.entrypoints=websecure"
      - "traefik.http.routers.tierlistrr.tls=true"
      - "traefik.http.services.tierlistrr.loadbalancer.server.port=3000"

volumes:
  tierlistrr-data:

networks:
  traefik:
    external: true
